name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest -q
        working-directory: backend

  android-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Run Android unit tests
        run: gradle :app:testDebugUnitTest --stacktrace

  android-release-apk:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Restore and verify signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.AUREX_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.AUREX_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.AUREX_KEY_ALIAS }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          test -n "$KEY_ALIAS"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > aurex-release.jks
          test -s aurex-release.jks
          keytool -list -keystore aurex-release.jks \
            -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null
          echo "KEYSTORE AND STORE PASSWORD: OK"

      - name: Build signed release APK
        env:
          AUREX_KEYSTORE_PASSWORD: ${{ secrets.AUREX_KEYSTORE_PASSWORD }}
          AUREX_KEY_ALIAS: ${{ secrets.AUREX_KEY_ALIAS }}
          AUREX_KEY_PASSWORD: ${{ secrets.AUREX_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: aurex-release-apk
          path: app/build/outputs/apk/release/*.apk
