# NOTE (Phase 1): this workflow has NOT been executed yet - it was written offline.
# The unit-test command inside it is the one that was run locally; ruff/mypy were not available.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit + integration tests
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff mypy
      - run: ruff check src tests
      - run: mypy src
  mutation-gate:
    # Re-runs the deliberate-fault checks so weakened safety code cannot merge silently.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/mutation_check.py
